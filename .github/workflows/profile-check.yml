# Weekly safety net: every public repo tagged claude-skill must have a row in README.md,
# and the README must have been edited after that repo's latest release.
# Opens (or updates) one issue when something is missing or stale; closes it when all is well.
name: Profile check
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare skill repos with the profile README
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          readme=$(gh api "repos/$REPO/readme" -H 'Accept: application/vnd.github.raw')
          edited=$(gh api "repos/$REPO/commits?path=README.md&per_page=1" --jq '.[0].commit.committer.date')
          problems=""
          for r in $(gh api "users/$OWNER/repos?per_page=100&type=owner" --jq '.[] | select(.private | not) | select(.fork | not) | select(.topics | index("claude-skill")) | .full_name'); do
            if ! grep -qi "github.com/$r[)/\"]" <<<"$readme"; then
              problems+="- [ ] **$r** is not listed: add a row to the Agent skills table."$'\n'
              continue
            fi
            released=$(gh api "repos/$r/releases/latest" --jq .published_at 2>/dev/null || true)
            if [ -n "$released" ] && [[ "$edited" < "$released" ]]; then
              problems+="- [ ] **$r** released ${released:0:10}, after the last README edit (${edited:0:10}): review its row's text and numbers."$'\n'
            fi
          done
          title="Profile README is behind the published skills"
          open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$problems" ]; then
            echo "Profile README is up to date."
            [ -n "$open" ] && gh issue close "$open" -R "$REPO" -c "All skill repos are listed and current."
            exit 0
          fi
          body="The weekly profile check found:"$'\n\n'"$problems"$'\n'"Fix README.md, then rerun the Profile check workflow (it closes this issue)."
          printf '%s' "$problems"
          if [ -n "$open" ]; then gh issue edit "$open" -R "$REPO" --body "$body"; else gh issue create -R "$REPO" --title "$title" --body "$body"; fi
